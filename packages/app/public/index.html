<!DOCTYPE html>

<html>

<head>
    <meta charSet="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Import map MUST come before any module scripts -->
    <script type="importmap">
    {
        "imports": {
            "react": "/api/shims/react.js",
            "react/jsx-runtime": "/api/shims/jsx-runtime.js",
            "react/jsx-dev-runtime": "/api/shims/jsx-runtime.js",
            "react-dom": "/api/shims/react-dom.js",
            "react-dom/client": "/api/shims/react-dom.js"
        }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex-swap.min.css"
        integrity="sha384-XqqnskmP1dvxUvvZ3AXYAFD9QfxyU22X7ZwX2TuTlO4Mn4+u3i2d0ypR7ooPKcYc" crossorigin="anonymous">
</head>

<body>
    <script>
        (function () {
            const theme = localStorage.getItem('ui-theme') || 'system';
            const root = document.documentElement;

            if (theme === 'system') {
                const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                root.classList.add(systemTheme);
            } else {
                root.classList.add(theme);
            }
        })();
    </script>
    <div id="root"></div>
    <script type="module" src="../src/client.tsx"></script>
</body>

</html>
